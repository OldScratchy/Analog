# https://github.com/fluent/fluent-bit/tree/master/conf
[PARSER]
    Name          regex_logs
    Format        regex
    # De utilidad: https://regex101.com/
    Regex         ^(?<time>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d{3})\s+-\s+(?<level>[^\s]+)\s+-\s+(?<message>.+)$
    Time_Key      time
    Time_Format   %Y-%m-%d %H:%M:%S,%L

